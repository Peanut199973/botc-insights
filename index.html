<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat whispers</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1c2430; --muted:#5b6574; --line:#d6dbe2; --faint:#c3c9d2;
  --node:#eceff3; --d1:#2f7fd6; --d2:#e08a12; --d3:#4f8a1e; --d4:#a23fb0; --d5:#0f9b95; --d6:#c93b6b; --d7:#4b5cc4; --d8:#8c5a2b;
  --focus:#1c2430; --accent:#d63e5c;
  --t1:#7a4fd6; --t2:#a68de6; --t3:#cdbff2;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141a22; --panel:#1b232d; --ink:#e8ecf1; --muted:#9aa6b5; --line:#2c3643; --faint:#3a4655;
    --node:#243040; --d1:#5aa2ee; --d2:#f0a73a; --d3:#7ab648; --d4:#d58be0; --d5:#4fd1c9; --d6:#f2729c; --d7:#8596f5; --d8:#d49b66;
    --focus:#e8ecf1; --accent:#ff6b86;
    --t1:#b39bf5; --t2:#8d73d6; --t3:#6a579f; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.45}
.wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,0.85fr);gap:28px;max-width:1120px;margin:0 auto;padding:28px 20px 40px}
header{grid-column:1/-1}
h1{font-size:1.6rem;line-height:1.2;margin:0 0 6px;font-weight:700;letter-spacing:-0.01em}
header p{margin:0;color:var(--muted);max-width:62ch}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 8px 8px}
.bar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:0 8px 6px}
.hint{color:var(--muted);font-size:.85rem}
svg{display:block;width:100%;height:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;align-self:start}
.panel h2{font-size:1.25rem;margin:0 0 4px}
.empty{color:var(--muted);margin:0}
.seg{display:flex;gap:5px;margin:8px 0 12px;flex-wrap:wrap;align-items:center}
.seg button{font:inherit;font-size:.88rem;padding:5px 10px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button .swatch{width:8px;height:8px;border-radius:50%;display:inline-block}
.seg .clear{margin-left:auto}
.seg .lbl{color:var(--muted);font-size:.88rem;margin-right:2px;font-weight:600}
.bar .seg{margin:0}
button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.node{outline:none;cursor:pointer}
.node:focus-visible .core{stroke:var(--focus);stroke-width:4}
h3{font-size:.95rem;margin:18px 0 8px;font-weight:700}
.row{display:grid;grid-template-columns:128px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.tag{font-size:.88rem;font-weight:600;display:flex;align-items:flex-start;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.names{display:flex;flex-wrap:wrap;gap:6px}
.names button{font:inherit;font-size:.9rem;padding:3px 10px;border:1px solid var(--line);background:var(--node);color:var(--ink);border-radius:999px;cursor:pointer}
.none{color:var(--muted);font-size:.9rem}
.pick{display:flex;gap:10px;align-items:center;margin:0 0 6px;font-size:.95rem;font-weight:600}
.pick select{font:inherit;font-weight:400;padding:6px 10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;min-width:150px}
.routes{display:grid;gap:10px;margin:12px 0 4px}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--node)}
.chip{padding:3px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:.92rem}
.chip.end{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hop{font-size:.85rem;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.hop i{display:inline-block;width:9px;height:9px;border-radius:50%}
.more{color:var(--muted);font-size:.88rem;margin:2px 0 0}
.total{margin:16px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.note{grid-column:1/-1;color:var(--muted);font-size:.85rem;max-width:80ch}
.lab{font-size:15px;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
.sub{font-size:12px;fill:var(--muted);paint-order:stroke;stroke:var(--panel);stroke-width:3px;stroke-linejoin:round}
@media (max-width:760px){
  .wrap{grid-template-columns:1fr;gap:18px;padding:18px 12px 32px}
  h1{font-size:1.35rem}
  .lab{font-size:21px}.sub{font-size:16px}
  .row{grid-template-columns:1fr;gap:6px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Chat whispers</h1>
    <p>Tap a player to see who they chatted with, day by day. Toggle multiple days on or off (e.g. D1–D3) to isolate specific phases, and pick a second player to trace unique chains between them.</p>
  </header>
  <div class="stage">
    <div class="bar"><div class="seg" id="layoutSeg" role="group" aria-label="Layout"></div><div class="seg" id="daySeg" role="group" aria-label="Days"></div><span class="hint">Larger circles mean more chats.</span></div>
    <svg id="map" viewBox="-30 0 700 660" role="group" aria-label="Players. Select a player to see who they could have reached."></svg>
  </div>
  <aside class="panel" id="panel" aria-live="polite"></aside>
  <p class="note" id="note"></p>
</div>
<script>
// ---- Data. Edit here. One line per chat: [player, player, day]. Day is "D1" through "D8".
const UPDATED = "16 Nov (through Day 7)";
const PLAYERS = ['Maki', 'Doow', 'Elannqa', 'Tieske', 'Peanut', 'Tritenaar', 'Geraldine', 'Kai', 'Hond', 'Stickle', 'Meeshab', 'Leon', 'Havensand', 'Hwol', 'DanceRev'];
const DEAD = ['Peanut', 'Hwol', 'Tritenaar', 'Kai', 'Hond', 'Elannqa', 'Geraldine', 'Doow', 'Meeshab', 'Leon'];
const CHATS = [
  ["DanceRev", "Havensand", "D1"],
  ["DanceRev", "Hond", "D1"],
  ["DanceRev", "Hwol", "D2"],
  ["DanceRev", "Kai", "D1"],
  ["DanceRev", "Meeshab", "D2"],

  ["Doow", "Hwol", "D2"],

  ["Doow", "Maki", "D1"],
  ["Doow", "Maki", "D2"],
  ["Doow", "Meeshab", "D2"],
  ["Doow", "Peanut", "D1"],
  ["Doow", "Tieske", "D1"],
  ["Elannqa", "Geraldine", "D1"],
  ["Elannqa", "Geraldine", "D2"],
  ["Elannqa", "Hwol", "D2"],
  ["Elannqa", "Kai", "D1"],
  ["Elannqa", "Leon", "D1"],
  ["Elannqa", "Meeshab", "D1"],
  ["Elannqa", "Peanut", "D2"],
  ["Geraldine", "Havensand", "D1"],
  ["Geraldine", "Kai", "D2"],
  ["Geraldine", "Leon", "D1"],
  ["Geraldine", "Peanut", "D1"],
  ["Geraldine", "Stickle", "D2"],
  ["Geraldine", "Tieske", "D2"],
  ["Geraldine", "Tritenaar", "D1"],
  ["Havensand", "Hond", "D2"],
  ["Havensand", "Meeshab", "D1"],
  ["Hond", "Hwol", "D1"],
  ["Hond", "Kai", "D1"],
  ["Hond", "Meeshab", "D1"],
  ["Hond", "Peanut", "D2"],
  ["Hond", "Stickle", "D1"],
  ["Hwol", "Leon", "D1"],
  ["Hwol", "Meeshab", "D1"],
  ["Hwol", "Peanut", "D1"],
  ["Hwol", "Tritenaar", "D1"],
  ["Kai", "Meeshab", "D1"],
  ["Leon", "Peanut", "D2"],
  ["Leon", "Tieske", "D2"],
  ["Meeshab", "Peanut", "D2"],
  ["Doow", "Hond", "D3"],
  ["Elannqa", "DanceRev", "D3"],
  ["Hwol", "Peanut", "D3"],
  ["Havensand", "Hond", "D3"],
  ["Havensand", "Leon", "D3"],
  ["Elannqa", "Peanut", "D3"],
  ["Havensand", "Stickle", "D3"],
  ["Kai", "Tieske", "D3"],
  ["Meeshab", "DanceRev", "D3"],
  ["Doow", "Geraldine", "D3"],
  ["Tritenaar", "Hwol", "D3"],
  ["Geraldine", "DanceRev", "D3"],
  ["Leon", "Geraldine", "D3"],
  ["Meeshab", "Peanut", "D3"],
  ["Doow", "Hwol", "D3"],
  ["Tritenaar", "Hwol", "D4"],
  ["Doow", "Hond", "D4"],
  ["Doow", "Meeshab", "D4"],
  ["Havensand", "Hwol", "D4"],
  ["Kai", "Leon", "D4"],
  ["Hwol", "Peanut", "D4"],
  ["Elannqa", "Tieske", "D4"],
  ["Leon", "Meeshab", "D4"],
  ["DanceRev", "Tieske", "D4"],
  ["Peanut", "Meeshab", "D4"],
  ["Havensand", "DanceRev", "D4"],
  ["Havensand", "Elannqa", "D4"],
  ["Hwol", "Tieske", "D4"],
  ["Doow", "Peanut", "D4"],
  ["Doow", "Geraldine", "D4"],
  ["Peanut", "Geraldine", "D4"],
  ["Meeshab", "Doow", "D5"],
  ["Meeshab", "Peanut", "D5"],
  ["Meeshab", "Leon", "D5"],
  ["Doow", "Peanut", "D5"],
  ["Doow", "Leon", "D5"],
  ["Peanut", "Leon", "D5"],
  ["Elannqa", "Tieske", "D5"],
  ["Doow", "Tieske", "D5"],
  ["Hwol", "Peanut", "D5"],
  ["Havensand", "Stickle", "D5"],
  ["Havensand", "Hond", "D5"],
  ["Havensand", "DanceRev", "D5"],
  ["Stickle", "Hond", "D5"],
  ["Stickle", "DanceRev", "D5"],
  ["Hond", "DanceRev", "D5"],
  ["Doow", "Hond", "D5"],
  ["DanceRev", "Tieske", "D5"],
  ["Havensand", "Elannqa", "D5"],
  ["Elannqa", "Geraldine", "D5"],
  ["Leon", "Meeshab", "D6"],
  ["Geraldine", "Leon", "D6"],
  ["Leon", "Peanut", "D6"],
  ["Leon", "Hwol", "D6"],
  ["Peanut", "Hwol", "D6"],
  ["Hwol", "Doow", "D6"],
  ["Doow", "Geraldine", "D6"],
  ["Geraldine", "Maki", "D6"],
  ["Maki", "Peanut", "D6"],
  ["Peanut", "Elannqa", "D6"],
  ["Meeshab", "Elannqa", "D6"],
  ["Havensand", "Tieske", "D6"],
  ["DanceRev", "Hond", "D6"],
  ["DanceRev", "Stickle", "D6"],
  ["Hwol", "Tieske", "D6"],
  ["Tieske", "Doow", "D7"],
  ["Doow", "Peanut", "D7"],
  ["Hwol", "Peanut", "D7"],
  ["Havensand", "Stickle", "D7"],
  ["Elannqa", "Tieske", "D7"],
  ["Elannqa", "Leon", "D7"],
  ["Havensand", "Hond", "D7"],
  ["Peanut", "Elannqa", "D7"],
  ["Havensand", "Tieske", "D7"],
  ["Havensand", "DanceRev", "D7"],
  ["Tieske", "DanceRev", "D7"],
];
// ---- End of data.

const ALL_DAYS = ["D1","D2","D3","D4","D5","D6","D7","D8"];
const DAYCOL = {D1:"var(--d1)", D2:"var(--d2)", D3:"var(--d3)", D4:"var(--d4)", D5:"var(--d5)", D6:"var(--d6)", D7:"var(--d7)", D8:"var(--d8)"};
const TIERCOL = ["var(--ink)","var(--t1)","var(--t2)","var(--t3)"];
const dayLabel = d => "Day " + d.slice(1);
const shortDay = d => "D" + d.slice(1);
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("map"), panel = document.getElementById("panel");
document.getElementById("note").textContent = "Lines are chats that were set up. Dotted lines are chains that are possible within one day, because the order of chats is not known. Updated " + UPDATED + ".";
const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

const chats = {D1:new Set(), D2:new Set(), D3:new Set(), D4:new Set(), D5:new Set(), D6:new Set(), D7:new Set(), D8:new Set()};
CHATS.forEach(([a,b,d]) => { if(chats[d]){ chats[d].add(a+"|"+b); chats[d].add(b+"|"+a); } });

// Multi-select day filter: Set of active day codes (defaults to all days with chats, or all D1-D8)
let selectedDays = new Set(ALL_DAYS);
const activeDays = () => ALL_DAYS.filter(d => selectedDays.has(d));
const partners = (p,d) => selectedDays.has(d) ? PLAYERS.filter(q => chats[d].has(p+"|"+q)) : [];
const anyPartners = p => PLAYERS.filter(q => activeDays().some(d => chats[d].has(p+"|"+q)));
const daysBetween = (p,q) => activeDays().filter(d => chats[d].has(p+"|"+q));
const radius = p => 9 + anyPartners(p).length*0.9;
const nm = n => n + (DEAD.includes(n) ? " (dead)" : "");

// ---- Layouts
const seat = {};
PLAYERS.forEach((n,i) => { const a=(-90+i*360/PLAYERS.length)*Math.PI/180; seat[n]={x:320+205*Math.cos(a), y:330+205*Math.sin(a), a}; });

function simulate(names, pairs){
  const n=names.length, idx={}; names.forEach((p,i)=>idx[p]=i);
  const edges=pairs.map(([a,b,wt]) => [idx[a],idx[b],wt]);
  let seed=11; const rnd=()=> (seed=(seed*16807)%2147483647)/2147483647;
  const P=names.map((p,i)=>({x:320+130*Math.cos(i*2.4)+(rnd()-.5)*40, y:270+130*Math.sin(i*2.4)+(rnd()-.5)*40, dx:0, dy:0}));
  const k=Math.max(90, Math.min(160, Math.sqrt(560*400/Math.max(n,1))*0.9)); let t=80;
  for(let it=0; it<600; it++){
    P.forEach(p=>{p.dx=0;p.dy=0;});
    for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){
      const dx=P[i].x-P[j].x, dy=P[i].y-P[j].y, d=Math.hypot(dx,dy)||0.01, f=k*k/d;
      P[i].dx+=dx/d*f; P[i].dy+=dy/d*f; P[j].dx-=dx/d*f; P[j].dy-=dy/d*f;
    }
    edges.forEach(([i,j,wt]) => {
      const dx=P[i].x-P[j].x, dy=P[i].y-P[j].y, d=Math.hypot(dx,dy)||0.01, f=d*d/k*(0.6+0.4*wt);
      P[i].dx-=dx/d*f; P[i].dy-=dy/d*f; P[j].dx+=dx/d*f; P[j].dy+=dy/d*f;
    });
    P.forEach(p => {
      p.dx+=(320-p.x)*0.06; p.dy+=(270-p.y)*0.06;
      const d=Math.hypot(p.dx,p.dy)||0.01, m=Math.min(d,t);
      p.x+=p.dx/d*m; p.y+=p.dy/d*m;
    });
    t=Math.max(1,t*0.985);
  }
  return P;
}
function clusterLayout(dayKey){
  const w={};
  CHATS.forEach(([a,b,d]) => {
    if(!selectedDays.has(d)) return;
    const k=[a,b].sort().join("|");
    w[k]=(w[k]||0)+1;
  });
  const pairs=Object.keys(w).map(k => { const [a,b]=k.split("|"); return [a,b,w[k]]; });
  const group={}; PLAYERS.forEach(p=>group[p]=p);
  const find=x=>group[x]===x?x:(group[x]=find(group[x]));
  pairs.forEach(([a,b]) => { group[find(a)]=find(b); });
  const comps={}; PLAYERS.forEach(p => { (comps[find(p)] = comps[find(p)] || []).push(p); });
  const list=Object.values(comps).sort((x,y)=>y.length-x.length);
  const out={}; const main=list[0] && list[0].length>1 ? list[0] : null;
  if(main){
    const mp=pairs.filter(([a,b])=>main.includes(a)&&main.includes(b));
    const P=simulate(main,mp), n=main.length;
    for(let pass=0; pass<120; pass++) for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){
      const dx=P[j].x-P[i].x, dy=P[j].y-P[i].y, d=Math.hypot(dx,dy)||0.01;
      if(d<64){ const m=(64-d)/2; P[i].x-=dx/d*m; P[i].y-=dy/d*m; P[j].x+=dx/d*m; P[j].y+=dy/d*m; }
    }
    const xs=P.map(q=>q.x), ys=P.map(q=>q.y);
    const minx=Math.min(...xs), maxx=Math.max(...xs), miny=Math.min(...ys), maxy=Math.max(...ys);
    const sc=Math.min(540/((maxx-minx)||1), 400/((maxy-miny)||1), 2.2);
    const mx=(minx+maxx)/2, my=(miny+maxy)/2;
    main.forEach((p,i) => out[p]={x:320+(P[i].x-mx)*sc, y:270+(P[i].y-my)*sc});
  }
  const rest=list.filter(c=>c!==main).sort((x,y)=>y.length-x.length);
  const slots=rest.map(c => ({c, wd:Math.max(1,c.length)*80}));
  const total=slots.reduce((a,sl)=>a+sl.wd,0); let x0=320-total/2;
  slots.forEach(sl => { sl.c.forEach((p,i) => { out[p]={x:x0+i*80+40, y:600}; }); x0+=sl.wd; });
  return out;
}
const clusterCache={};
const clusterKey = () => activeDays().join(",") || "none";
const clusterFor = () => { const k=clusterKey(); return clusterCache[k] || (clusterCache[k]=clusterLayout(k)); };

let layout="circle";
const cur = {}; PLAYERS.forEach(p => cur[p]={x:seat[p].x, y:seat[p].y});

// ---- SVG
function el(tag, attrs, parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }
const gLines=el("g",{},svg), gPath=el("g",{},svg), gNodes=el("g",{},svg);
const base=[], seen=new Set();
CHATS.forEach(([a,b]) => { const k=[a,b].sort().join("|"); if(seen.has(k)) return; seen.add(k);
  base.push({a,b,e:el("line",{stroke:"var(--faint)","stroke-width":1.2},gLines)}); });
const nodes={};
PLAYERS.forEach(n => {
  const g=el("g",{class:"node",tabindex:0,role:"button","aria-pressed":"false","aria-label":n+(DEAD.includes(n)?", dead":"")},gNodes);
  el("circle",{r:26,fill:"transparent"},g);
  const halo=el("circle",{class:"halo",fill:"none",stroke:"var(--accent)","stroke-width":3,opacity:0},g);
  const core=el("circle",{class:"core",fill:"var(--node)",stroke:"var(--muted)","stroke-width":1.6},g);
  if(DEAD.includes(n)) core.setAttribute("stroke-dasharray","3 2.5");
  const t=el("text",{class:"lab","dominant-baseline":"central"},g); t.textContent=n;
  let s=null; if(DEAD.includes(n)){ s=el("text",{class:"sub","dominant-baseline":"central"},g); s.textContent="dead"; }
  g.addEventListener("click",()=>pickNode(n));
  g.addEventListener("keydown",e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); pickNode(n); } });
  nodes[n]={g,halo,core,t,s};
});

// ---- State
let current=null, target=null, mode="direct", startDay=1, depth=2, labelsOn=true;

function reachDay(start, from){
  const S=new Set([start]), P=new Set([start]);
  const reached={}; reached[start]=0; const stages=[], edges=[], status={}; status[start]="start";
  const days = activeDays();
  for(let di=0; di<days.length; di++){
    const d=days[di];
    const dNum = Number(d.slice(1));
    if(dNum < from) continue;
    const S0=new Set(S), fresh=[], maybe=[];
    for(const p of S0) for(const q of partners(p,d)) if(!S.has(q)){ edges.push({p,q,c:DAYCOL[d],solid:p===start,dotted:false}); if(!fresh.includes(q)) fresh.push(q); }
    fresh.forEach(q => { S.add(q); P.add(q); reached[q]=dNum; status[q]="sure"; });
    let grew=true; const pool=new Set(P);
    while(grew){ grew=false;
      for(const p of Array.from(pool)) for(const q of partners(p,d)) if(!pool.has(q)){
        pool.add(q); grew=true; edges.push({p,q,c:DAYCOL[d],solid:false,dotted:true});
        if(!(q in reached)){ reached[q]=dNum; status[q]="maybe"; maybe.push(q); }
        P.add(q);
      }
    }
    stages.push({label:"After "+dayLabel(d), color:DAYCOL[d], fresh, maybe, day:d});
  }
  return {reached, stages, edges, status, colorOf:q=>DAYCOL["D"+reached[q]]};
}
function reachAny(start, maxTier){
  const reached={}; reached[start]=0; const stages=[], edges=[]; let prev=[start];
  const names=["Direct","One step further","Two steps further"];
  for(let k=1;k<=maxTier;k++){
    const fresh=[];
    prev.forEach(p => anyPartners(p).forEach(q => { if(!(q in reached)){ if(!fresh.includes(q)) fresh.push(q); } }));
    fresh.forEach(q => reached[q]=k);
    prev.forEach(p => fresh.forEach(q => { if(anyPartners(p).includes(q)) edges.push({p,q,c:TIERCOL[k],solid:k===1}); }));
    stages.push({label:names[k-1], color:TIERCOL[k], fresh}); prev=fresh;
  }
  return {reached, stages, edges, colorOf:q=>TIERCOL[reached[q]]};
}
function reachDirect(start){
  const reached={}; reached[start]=0; const stages=[], edges=[], status={}; status[start]="start";
  const seenPair={};
  activeDays().forEach(d => {
    const dNum = Number(d.slice(1));
    const fresh=partners(start,d);
    fresh.forEach(q => {
      if(!(q in reached)){ reached[q]=dNum; status[q]="sure"; }
      const k=seenPair[q]=(seenPair[q]||0)+1;
      edges.push({p:start,q,c:DAYCOL[d],solid:true,dotted:false,off:k-1});
    });
    stages.push({label:dayLabel(d), color:DAYCOL[d], fresh, maybe:[], day:d});
  });
  return {reached, stages, edges, status, colorOf:q=>DAYCOL["D"+reached[q]]};
}
const reach = () => mode==="direct" ? reachDirect(current) : (mode==="day" ? reachDay(current,startDay) : reachAny(current,depth));
const directNow = n => mode==="day" ? activeDays().filter(d=>Number(d.slice(1))>=startDay).some(d=>chats[d].has(current+"|"+n)) : anyPartners(current).includes(n);

// Deduplicated route finder: collapses repeated player sequences into single unique chains with day tags
function routesTo(start, goal){
  const raw=[];
  const days = activeDays();
  (function go(c, minDayNum, path, visited){
    if(c===goal){ raw.push(path.slice()); return; }
    if(path.length>=3) return;
    if(mode==="day"){
      for(let di=0; di<days.length; di++){
        const d = days[di];
        const dNum = Number(d.slice(1));
        if(dNum < minDayNum) continue;
        for(const q of partners(c,d)){
          if(visited.has(q)) continue;
          visited.add(q);
          path.push({p:c,q,days:[d]});
          go(q, dNum, path, visited);
          path.pop();
          visited.delete(q);
        }
      }
    } else {
      for(const q of anyPartners(c)){
        if(visited.has(q)) continue;
        visited.add(q);
        path.push({p:c,q,days:daysBetween(c,q)});
        go(q, 0, path, visited);
        path.pop();
        visited.delete(q);
      }
    }
  })(start, startDay, [], new Set([start]));

  // Deduplicate identical player paths (e.g. A -> X -> B via D1/D2 vs D1/D3) by merging hop days
  const merged = new Map();
  raw.forEach(rt => {
    const nodeSeq = [start, ...rt.map(h => h.q)].join("->");
    if(!merged.has(nodeSeq)){
      merged.set(nodeSeq, rt.map(h => ({p:h.p, q:h.q, days:new Set(h.days)})));
    } else {
      const existing = merged.get(nodeSeq);
      rt.forEach((h, idx) => h.days.forEach(d => existing[idx].days.add(d)));
    }
  });

  const out = Array.from(merged.values()).map(rt => {
    const clean = rt.map(h => ({
      p: h.p,
      q: h.q,
      days: ALL_DAYS.filter(d => h.days.has(d))
    }));
    // Mark as potentially same-day if any consecutive hops share a single common day
    clean.same = mode==="day" && clean.some((h, i) => i>0 && h.days.length===1 && clean[i-1].days.length===1 && h.days[0]===clean[i-1].days[0]);
    return clean;
  });

  out.sort((a,b)=> a.length-b.length || (a.same-b.same) || a.map(h=>h.days[0]).join().localeCompare(b.map(h=>h.days[0]).join()));
  return out;
}

// ---- Drawing
function labelOffset(p, r){
  if(layout==="circle"){ const c=Math.cos(seat[p].a), s=Math.sin(seat[p].a); const anc=c>0.25?"start":(c<-0.25?"end":"middle"); return {x:(r+14)*c, y:(r+14)*s, anc}; }
  return {x:0, y:r+16, anc:"middle"};
}
function place(){
  const narrow = window.innerWidth<=760;
  PLAYERS.forEach(p => {
    const n=nodes[p], r=radius(p)+(p===current?2:0);
    n.g.setAttribute("transform","translate("+cur[p].x+" "+cur[p].y+")");
    n.core.setAttribute("r",r); n.halo.setAttribute("r",r+6);
    const o=labelOffset(p,r);
    n.t.setAttribute("x",o.x); n.t.setAttribute("y",o.y); n.t.setAttribute("text-anchor",o.anc);
    n.t.setAttribute("opacity",labelsOn?1:0);
    if(n.s){ n.s.setAttribute("x",o.x); n.s.setAttribute("y",o.y+(narrow?20:16)); n.s.setAttribute("text-anchor",o.anc); n.s.setAttribute("opacity",labelsOn?1:0); }
  });
  base.forEach(l => { l.e.setAttribute("x1",cur[l.a].x); l.e.setAttribute("y1",cur[l.a].y); l.e.setAttribute("x2",cur[l.b].x); l.e.setAttribute("y2",cur[l.b].y); });
}
function paint(){
  place();
  gPath.innerHTML="";
  base.forEach(l => { const on=activeDays().some(d=>chats[d].has(l.a+"|"+l.b)); l.e.setAttribute("opacity", on ? (current?0.12:0.5) : 0); });
  PLAYERS.forEach(n => { const x=nodes[n]; x.core.setAttribute("fill","var(--node)"); x.core.setAttribute("fill-opacity",1); x.core.setAttribute("stroke","var(--muted)"); x.core.setAttribute("stroke-width",1.6); x.halo.setAttribute("opacity",0); x.g.setAttribute("aria-pressed","false"); });
  if(!current) return;
  const r=reach(), dim=target?0.25:0.9;
  r.edges.forEach(e => { let ox=0, oy=0; if(e.off){ const dx=cur[e.q].x-cur[e.p].x, dy=cur[e.q].y-cur[e.p].y, L=Math.hypot(dx,dy)||1; ox=-dy/L*e.off*5; oy=dx/L*e.off*5; } el("line",{x1:cur[e.p].x+ox,y1:cur[e.p].y+oy,x2:cur[e.q].x+ox,y2:cur[e.q].y+oy,stroke:e.c,"stroke-width":e.solid?3:2.2,"stroke-dasharray":e.dotted?"1.5 6":(e.solid?"none":"5 4"),opacity:e.dotted?dim*0.9:dim,"stroke-linecap":"round"},gPath); });
  Object.keys(r.reached).forEach(n => { if(n===current) return; const c=nodes[n].core; const maybe=r.status && r.status[n]==="maybe"; c.setAttribute("fill",r.colorOf(n)); c.setAttribute("fill-opacity",maybe?0.3:1); c.setAttribute("stroke",r.colorOf(n)); if(mode!=="direct" && directNow(n)){ c.setAttribute("stroke","var(--ink)"); c.setAttribute("stroke-width",3); } });
  if(target){
    routesTo(current,target).slice(0,8).forEach(rt => rt.forEach((h,i) => { const sameHop = mode==="day" && i>0 && h.days.length===1 && rt[i-1].days.length===1 && h.days[0]===rt[i-1].days[0]; el("line",{x1:cur[h.p].x,y1:cur[h.p].y,x2:cur[h.q].x,y2:cur[h.q].y,stroke:mode==="day"?DAYCOL[h.days[0]]:"var(--t1)","stroke-width":5,"stroke-dasharray":sameHop?"1.5 8":"none",opacity:1,"stroke-linecap":"round"},gPath); }));
    nodes[target].core.setAttribute("stroke","var(--ink)"); nodes[target].core.setAttribute("stroke-width",4);
  }
  const c=nodes[current]; c.core.setAttribute("fill","var(--ink)"); c.core.setAttribute("stroke","var(--ink)"); c.halo.setAttribute("opacity",1); c.g.setAttribute("aria-pressed","true");
}

function targetPositions(){
  const to={}; PLAYERS.forEach(p => to[p] = layout==="circle" ? {x:seat[p].x,y:seat[p].y} : clusterFor()[p]);
  return to;
}
function animateTo(to){
  const from={}; PLAYERS.forEach(p=>from[p]={x:cur[p].x,y:cur[p].y});
  if(reduceMotion){ PLAYERS.forEach(p=>{cur[p].x=to[p].x;cur[p].y=to[p].y;}); paint(); return; }
  labelsOn=false; const t0=performance.now(), D=520;
  (function step(now){
    const k=Math.min(1,(now-t0)/D), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    PLAYERS.forEach(p=>{ cur[p].x=from[p].x+(to[p].x-from[p].x)*e; cur[p].y=from[p].y+(to[p].y-from[p].y)*e; });
    if(k>=1) labelsOn=true;
    paint(); if(k<1) requestAnimationFrame(step);
  })(t0);
}
function setLayout(next){
  if(next===layout) return;
  layout=next; renderBar(); animateTo(targetPositions());
}

// ---- Panel & Multi-select Day Bar
function nameButtons(list){
  const wrap=document.createElement("div"); wrap.className="names";
  list.forEach(n => { const b=document.createElement("button"); b.type="button"; b.textContent=nm(n); b.addEventListener("click",()=>{ target=n; if(mode==="direct") mode="day"; paint(); render(); }); wrap.appendChild(b); });
  return wrap;
}
function segButtons(parent, items, isOn, onPick, label){
  const seg=document.createElement("div"); seg.className="seg"; seg.setAttribute("role","group");
  if(label){ const l=document.createElement("span"); l.className="lbl"; l.textContent=label; seg.appendChild(l); seg.setAttribute("aria-label",label); }
  items.forEach(([text,val]) => { const b=document.createElement("button"); b.type="button"; b.textContent=text; b.setAttribute("aria-pressed",String(isOn(val))); b.addEventListener("click",()=>onPick(val)); seg.appendChild(b); });
  parent.appendChild(seg); return seg;
}
function syncStartDay(){
  const days = activeDays().map(d => Number(d.slice(1)));
  if(days.length && !days.includes(startDay)) startDay = days[0];
}
function refreshAfterDayChange(){
  syncStartDay();
  renderBar();
  if(layout==="cluster") animateTo(targetPositions());
  else paint();
  render();
}
function renderBar(){
  const seg=document.getElementById("layoutSeg"); seg.innerHTML="";
  [["Seat circle","circle"],["Clusters","cluster"]].forEach(([t,v]) => { const b=document.createElement("button"); b.type="button"; b.textContent=t; b.setAttribute("aria-pressed",String(layout===v)); b.addEventListener("click",()=>setLayout(v)); seg.appendChild(b); });

  const dseg=document.getElementById("daySeg"); dseg.innerHTML="";
  const dl=document.createElement("span"); dl.className="lbl"; dl.textContent="Days:"; dseg.appendChild(dl);

  const allOn = selectedDays.size === ALL_DAYS.length;
  const bAll=document.createElement("button"); bAll.type="button"; bAll.textContent="All";
  bAll.setAttribute("aria-pressed", String(allOn));
  bAll.addEventListener("click",()=>{ selectedDays = new Set(ALL_DAYS); refreshAfterDayChange(); });
  dseg.appendChild(bAll);

  ALL_DAYS.forEach(d => {
    const b=document.createElement("button"); b.type="button";
    const sw=document.createElement("span"); sw.className="swatch"; sw.style.background=DAYCOL[d];
    b.appendChild(sw);
    b.appendChild(document.createTextNode(shortDay(d)));
    const isPressed = !allOn && selectedDays.has(d);
    b.setAttribute("aria-pressed", String(isPressed));
    b.title = "Toggle " + dayLabel(d) + " (tap multiple days to combine, e.g. D1, D2, D3)";
    b.addEventListener("click",()=>{
      if(allOn){
        selectedDays = new Set([d]);
      } else if(selectedDays.has(d)){
        selectedDays.delete(d);
        if(selectedDays.size === 0) selectedDays = new Set(ALL_DAYS);
      } else {
        selectedDays.add(d);
      }
      refreshAfterDayChange();
    });
    dseg.appendChild(b);
  });
}
function rowEl(tagText, color, content){
  const row=document.createElement("div"); row.className="row";
  const tag=document.createElement("div"); tag.className="tag";
  const dot=document.createElement("span"); dot.className="dot"; dot.style.background=color; tag.appendChild(dot); tag.appendChild(document.createTextNode(tagText));
  row.appendChild(tag); row.appendChild(content); return row;
}
function render(){
  panel.innerHTML="";
  if(!current){ const p=document.createElement("p"); p.className="empty"; p.textContent="Select a player to see who could have heard from them."; panel.appendChild(p); return; }
  const r=reach();
  const h=document.createElement("h2"); h.textContent="From "+nm(current); panel.appendChild(h);
  segButtons(panel,[["Direct chats","direct"],["By day","day"],["Any order","any"]],v=>mode===v,v=>{mode=v; if(mode==="direct") target=null; paint();render();},"Show");
  if(mode==="direct"){} else if(mode==="day"){
    const dayOpts = activeDays().map(d => [shortDay(d), Number(d.slice(1))]);
    if(dayOpts.length) segButtons(panel,dayOpts,v=>startDay===v,v=>{startDay=v;paint();render();},"Starts from");
  } else segButtons(panel,[["Direct",1],["One step",2],["Two steps",3]],v=>depth===v,v=>{depth=v;paint();render();},"How far");
  const clr=document.createElement("button"); clr.type="button"; clr.className="clear"; clr.textContent="Clear"; clr.addEventListener("click",()=>select(null));
  panel.lastChild.appendChild(clr);

  const desc=document.createElement("p"); desc.className="hint"; desc.style.margin="0 0 12px";
  desc.textContent = mode==="direct" ? "Players this person chatted with directly, coloured by the day." : (mode==="day" ? "Players who could have heard from them if it was passed on, day by day. A lit-up player has not necessarily chatted with them: players with a dark ring did." : "Players linked to them through chats, ignoring the order of days. Violet shows distance: darkest is a direct chat, paler is one step further, palest is two steps further.");
  panel.appendChild(desc);
  const pick=document.createElement("label"); pick.className="pick"; pick.appendChild(document.createTextNode("Show chain to"));
  const sel=document.createElement("select"); const o0=document.createElement("option"); o0.value=""; o0.textContent="Choose a player"; sel.appendChild(o0);
  PLAYERS.filter(n=>n!==current).forEach(n=>{ const o=document.createElement("option"); o.value=n; o.textContent=nm(n); if(n===target) o.selected=true; sel.appendChild(o); });
  sel.addEventListener("change",()=>{ target=sel.value||null; if(target && mode==="direct") mode="day"; paint(); render(); });
  pick.appendChild(sel); panel.appendChild(pick);

  if(target){
    const rts=routesTo(current,target), box=document.createElement("div"); box.className="routes";
    if(!rts.length){ const n=document.createElement("p"); n.className="none"; n.textContent="No chain from "+nm(current)+" to "+nm(target)+" in selected days."; box.appendChild(n); }
    rts.slice(0,12).forEach(rt => {
      const d=document.createElement("div"); d.className="route"; if(rt.same) d.style.borderStyle="dotted";
      const a=document.createElement("span"); a.className="chip"; a.textContent=current; d.appendChild(a);
      rt.forEach((hp,i) => {
        const hop=document.createElement("span"); hop.className="hop";
        const dot=document.createElement("i"); dot.style.background=mode==="day"?DAYCOL[hp.days[0]]:"var(--t1)"; hop.appendChild(dot);
        const sameHop = mode==="day" && i>0 && hp.days.length===1 && rt[i-1].days.length===1 && hp.days[0]===rt[i-1].days[0];
        const dTxt = hp.days.length===1 ? dayLabel(hp.days[0]) : ("Days " + hp.days.map(x=>x.slice(1)).join(", "));
        hop.appendChild(document.createTextNode(dTxt + (sameHop?" (same day)":"") + " →")); d.appendChild(hop);
        const c=document.createElement("span"); c.className="chip"+(i===rt.length-1?" end":""); c.textContent=nm(hp.q); d.appendChild(c);
      });
      box.appendChild(d);
    });
    panel.appendChild(box);
    if(rts.some(x=>x.same)){ const m=document.createElement("p"); m.className="more"; m.textContent="Dotted routes pass through a chain within one day, so the order is not known."; panel.appendChild(m); }
    if(rts.length>12){ const m=document.createElement("p"); m.className="more"; m.textContent=(rts.length-12)+" more unique chains not shown."; panel.appendChild(m); }
  }

  const h3=document.createElement("h3"); h3.textContent=mode==="direct"?"Chatted with":"Could have reached"; panel.appendChild(h3);
  r.stages.forEach(s => {
    let content=document.createElement("div");
    if(s.fresh.length) content.appendChild(nameButtons(s.fresh)); else if(!(s.maybe&&s.maybe.length)){ const n=document.createElement("div"); n.className="none"; n.textContent=mode==="direct"?"None":"No one new"; content.appendChild(n); }
    if(s.maybe && s.maybe.length){ const l=document.createElement("div"); l.className="none"; l.style.margin="6px 0 4px"; l.textContent="Possibly, through a chain within the day"; content.appendChild(l); const nb=nameButtons(s.maybe); nb.querySelectorAll("button").forEach(b=>b.style.borderStyle="dotted"); content.appendChild(nb); }
    panel.appendChild(rowEl(s.label,s.color,content));
  });
  const names=Object.keys(r.reached).filter(n=>n!==current), maybeN=names.filter(n=>r.status&&r.status[n]==="maybe").length, sureN=names.length-maybeN;
  const tot=document.createElement("p"); tot.className="total"; tot.textContent=mode==="direct" ? sureN+" different players." : sureN+" of "+(PLAYERS.length-1)+" other players"+(maybeN?", and "+maybeN+" more possibly.":"."); panel.appendChild(tot);

  if(mode==="direct") return;
  const h3b=document.createElement("h3"); h3b.textContent="Their chats"; panel.appendChild(h3b);
  activeDays().forEach(d => {
    const list=partners(current,d); let content;
    if(list.length) content=nameButtons(list); else { content=document.createElement("div"); content.className="none"; content.textContent="None"; }
    panel.appendChild(rowEl(dayLabel(d),DAYCOL[d],content));
  });
}

function pickNode(n){ if(n===current) select(null); else if(n===target){ target=null; paint(); render(); } else select(n); }
function select(n){ if(n!==current) target=null; current=n; if(n===null) target=null; paint(); render(); }
document.addEventListener("keydown",e => { if(e.key==="Escape" && current) select(null); });
window.addEventListener("resize",place);
renderBar(); paint(); render();
</script>
</body>
